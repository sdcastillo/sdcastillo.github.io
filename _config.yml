# Dependencies
markdown:         kramdown
highlighter:      rouge
# Setup
title:            SamWiki
tagline:          'Public index of math, machine learning, and actuarial work'
theme: jekyll-theme-cayman
description:      'Sam Castillo’s public index of math, machine learning, and actuarial projects. Challenge ladder of demos, source code, and notes.'
url:              https://sdcastillo.github.io
baseurl:          /blog # the optional subpath of your site, e.g. "/blog"
                  # NB: This applies to all pages in your Jekyll site.
                  # If you want to move just the blog index pages but keep
                  # other pages at root, see the paginate_path and
                  # sidebar_blog_link below.

google_analytics: UA-113404765-1

author:
  name:           'Samuel Castillo'
  url:            https://sdcastillo.github.io

paginate:         7
# paginate_path:    '/page:num'
                    # Or '/blog/page:num' if you want to move your index pages

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate

# Custom vars
version:            6.7.9
sidebar_home_link:  true
# sidebar_blog_link:  '/blog'   # By default, your home page is your blog
                                # page. If you change your paginate_path,
                                # set this to the root of the paginate_path
                                # to enable a separate blog link.
github:
  repo:             https://github.com/sdcastillo/
