# SamWiki theme contract
# Theme setup follows GitHub's Jekyll theme guide:
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# Strategy: one supported theme, jekyll-theme-cayman, skinned in assets/css/style.scss.
# Other project Pages repositories should copy:
#   _config.yml          (this theme line; set the project title and description)
#   assets/css/style.scss
#   _layouts/default.html
#   _includes/head-custom.html
#   _includes/samwiki-nav.html
# and set `samwiki: true` in the page front matter.
#
# Pages for this repository publish from `main` at the domain root.
# https://sdcastillo.github.io/blog/ is not a live path, so baseurl stays unset.

title: Sam Castillo
description: Projects, articles, and source on github.io.
theme: jekyll-theme-cayman
show_downloads: false
markdown: kramdown
